<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkFNB Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef1fb; --card: #ffffff; --ink: #0f1b3d; --muted: #5d6988; --line: #e1e6f4;
    --navy: #0b1d3f; --navy-2: #12306b; --navy-ink: #e8edfb; --navy-muted: #9aa8cc;
    --blue: #2563eb; --green: #16a34a; --red: #e5484d; --amber: #f5a524; --grey: #8a94b0;
    --shadow: 0 1px 2px rgba(15,27,61,.06), 0 8px 24px rgba(15,27,61,.06); --radius: 16px;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #080f20; --card: #101a33; --ink: #e8edfb; --muted: #9aa8cc; --line: #1d2a4d; }
  }
  :root[data-theme="dark"] { --bg: #080f20; --card: #101a33; --ink: #e8edfb; --muted: #9aa8cc; --line: #1d2a4d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
         background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--navy-ink); border-radius: var(--radius); padding: 10px 18px; box-shadow: var(--shadow); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; background: linear-gradient(135deg, #22c55e, #2563eb); }
  .brand b { display: block; letter-spacing: .16em; font-size: 17px; line-height: 1.1; } .brand small { color: var(--navy-muted); font-size: 11px; }
  .top a { color: var(--navy-ink); font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.1); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 14px; }
  .bar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .bar label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  select, input, .btn { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 38px; }
  .btn { cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .grow { flex: 1; }
  .count { color: var(--muted); font-size: 13px; padding: 0 16px 8px; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--card); }
  td.t { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.d { color: var(--muted); word-break: break-word; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--grey); }
  .msg { padding: 28px 16px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--red); }
  .more { padding: 14px 16px; text-align: center; }
  @media (max-width: 560px) { .app { padding: 10px; } th, td { padding: 8px 10px; } .hide-s { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">P</div><div><b>PARKFNB</b><small>Activity log</small></div></div>
    <span><a href="/">&larr; Console</a> &nbsp;·&nbsp; <a id="back" href="/live">Live view</a></span>
  </header>

  <section class="card">
    <div class="bar">
      <label>Period
        <select id="days">
          <option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option><option value="0">Everything</option>
        </select>
      </label>
      <label>Show
        <select id="kind">
          <option value="in,out,bay_occupied,bay_freed,bay_initial,feed_offline,feed_online,low_light,light_ok,camera_moved,camera_ok,operator,parking_over_line,parking_ok" selected>All events</option>
          <option value="">Everything, with the minute-by-minute samples</option>
          <option value="bay_occupied,bay_freed,bay_initial">Bays turning occupied / free</option>
          <option value="in,out">Cars at the gate</option>
          <option value="feed_offline,feed_online,low_light,light_ok,camera_moved,camera_ok">Camera and light problems</option>
          <option value="operator">Operator answers</option>
          <option value="sample">Minute-by-minute occupancy</option>
        </select>
      </label>
      <label class="grow">Bay (like P3)
        <input id="bay" placeholder="all bays" maxlength="32" autocomplete="off">
      </label>
      <a class="btn primary" id="csv" href="#" download>Download CSV</a>
    </div>
    <div class="count" id="count" role="status"></div>
    <div class="wrap">
      <table>
        <thead><tr><th>Time</th><th>Event</th><th>Bay</th><th class="hide-s">Detail</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="more" id="more" hidden><button class="btn" id="moreBtn" type="button">Show more</button></div>
  </section>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var cam = (params.get("camera_id") || "phone-1");
  var camQ = encodeURIComponent(cam);
  var $ = function (id) { return document.getElementById(id); };
  var PAGE = 300, shown = 0, total = 0, rowsAll = [];
  var COLOUR = { bay_occupied: "#e5484d", bay_freed: "#16a34a", bay_initial: "#8a94b0", in: "#16a34a", out: "#f5a524",
                 feed_offline: "#e5484d", feed_online: "#16a34a", low_light: "#f5a524", light_ok: "#16a34a",
                 camera_moved: "#f5a524", camera_ok: "#16a34a", operator: "#2563eb", sample: "#8a94b0",
                 parking_over_line: "#e5484d", parking_ok: "#16a34a" };
  $("back").href = "/live?camera_id=" + camQ;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function query() { return "camera_id=" + camQ + "&days=" + encodeURIComponent($("days").value) + "&kind=" + encodeURIComponent($("kind").value); }
  function setCsv() { $("csv").href = "/live/log.csv?" + query(); }
  function say(text, err) { var m = $("msg"); m.hidden = !text; m.textContent = text || ""; m.className = "msg" + (err ? " err" : ""); }

  function stamp(epoch) {                                   // in the browser's own timezone
    var d = new Date(epoch * 1000);
    return d.toLocaleDateString([], { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function draw() {
    var want = $("bay").value.trim().toLowerCase(), tb = $("rows");
    while (tb.firstChild) tb.removeChild(tb.firstChild);
    var list = rowsAll.filter(function (r) { return !want || (r.bay || "").toLowerCase() === want || (r.bay || "").toLowerCase() === "p" + want; });
    var upto = Math.min(list.length, shown || PAGE);
    list.slice(0, upto).forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "t", stamp(r.epoch)));
      var ev = el("td"); var dot = el("i", "dot"); dot.style.background = COLOUR[r.type] || "var(--grey)";
      ev.appendChild(dot); ev.appendChild(document.createTextNode(r.event)); tr.appendChild(ev);
      tr.appendChild(el("td", "", r.bay || ""));
      tr.appendChild(el("td", "d hide-s", r.detail || ""));
      tb.appendChild(tr);
    });
    $("more").hidden = upto >= list.length;
    $("count").textContent = list.length + " event" + (list.length === 1 ? "" : "s") + (want ? " for " + $("bay").value.trim() : "") +
                             (total > rowsAll.length ? " (showing the newest " + rowsAll.length + " of " + total + "; download the CSV for all)" : "");
    say(list.length ? "" : (total ? "Nothing for that bay." : "Nothing has been logged for this period yet."), false);
  }

  function load() {
    setCsv(); say("Loading…", false);
    fetch("/live/log.json?" + query() + "&limit=5000", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) {
        if (r.status === 403) throw new Error("This page is for the operator. Sign in with the admin link first.");
        if (!r.ok) throw new Error("The server answered " + r.status + ".");
        return r.json();
      })
      .then(function (j) { rowsAll = j.rows; total = j.total; shown = PAGE; draw(); })
      .catch(function (e) { rowsAll = []; total = 0; draw(); $("count").textContent = ""; say(e.message, true); });
  }

  $("days").onchange = load; $("kind").onchange = load;
  $("bay").oninput = function () { shown = PAGE; draw(); };
  $("moreBtn").onclick = function () { shown += PAGE; draw(); };
  load();
})();
</script>
</body>
</html>
