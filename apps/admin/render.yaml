# Render blueprint for the Parkfnb admin panel.
#
# A static site: Vite builds to dist/ and Render serves it. Free, and unlike a
# web service it does not sleep.
#
# The panel talks to the API from the browser, so the API's CORS origin must
# include this site's URL — set FRONTEND_URL on the parkfnb service to whatever
# Render assigns here, or the panel will load and then fail every request.

services:
  - type: web
    name: parkfnb-admin
    runtime: static
    rootDir: apps/admin
    # --include=dev because the build needs devDependencies: `npm run build`
    # is `tsc -b && vite build`, and typescript, @types/react and
    # @types/react-dom all live there. A stray NODE_ENV=production on the
    # service makes npm skip them, and the build then dies with dozens of
    # "JSX element implicitly has type 'any'" errors that look like broken
    # source but are only React's type definitions being absent.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://parkfnb.onrender.com
    routes:
      # Client-side routing: every path has to return index.html, or a reload
      # on /owners/:id — or any link someone pastes — answers 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
