# Render blueprint for the Parkfnb API.
#
# The free plan sleeps after 15 minutes of inactivity and takes about a minute
# to wake, which is fine for a demo and not for a pilot — move to `starter`
# (about Rs 600/month) before putting it in front of anyone.
#
# Secrets are deliberately not set here. Anything marked `sync: false` is added
# in the Render dashboard so it never lives in the repository.

services:
  - type: web
    name: parkfnb
    runtime: node
    plan: free
    region: singapore          # closest to India of Render's regions
    rootDir: software/services/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # set in the dashboard
      - key: JWT_SECRET
        sync: false            # set in the dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false            # the admin panel's origin, for CORS

      # ---- Uploads -------------------------------------------------
      # Without these, uploads fall back to the container's own disk, which
      # Render wipes on every deploy — taking every KYC document and space
      # photo with it. All three are required together.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Physical barrier over Firebase --------------------------
      # The arch-lock unit polls a Realtime Database rather than speaking
      # MQTT, so the API mirrors every open/close there. Leaving
      # FIREBASE_DATABASE_URL unset disables the bridge and the barrier
      # simply never moves.
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_BARRIER_ENABLED
        value: "true"
      # Maps device ids to Firebase barrier ids — different namespaces.
      - key: FIREBASE_DEVICE_MAP
        value: pb-001:BARRIER_001
      # The firmware compares the raw JSON string, so the case must match
      # exactly. Its source does `response == "\"OPEN\""`, hence upper.
      - key: FIREBASE_ACTION_CASE
        value: upper

      # ---- MQTT ----------------------------------------------------
      # Unset falls back to the public broker.hivemq.com, which is fine for
      # a simulator and not fine for real hardware: no credentials, no TLS,
      # and anyone who knows a device id can drive it.
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        sync: false
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false

      # ---- Owner web dashboard: camera access -----------------------
      # POST /api/cameras/access-grant signs a 15-minute pass that an owner's
      # browser presents to the ANPR service (ai/anpr, on EC2). The ANPR
      # service verifies it with the SAME secret: set the same value here and
      # as ANPR_GRANT_SECRET in /etc/parkfnb-anpr.env. 32+ random characters,
      # and not JWT_SECRET. Unset, the grant answers 503.
      #
      # The ANPR address has no Elastic IP yet and can change, so it is set
      # in the dashboard rather than committed here.
      - key: ANPR_GRANT_SECRET
        sync: false
      - key: ANPR_DEFAULT_BASE_URL
        sync: false            # e.g. https://3-7-139-193.sslip.io
      - key: ANPR_BASE_URLS
        sync: false            # more ANPR servers, comma separated (optional)

      # ---- Test-only switches --------------------------------------
      # Unsafe in front of real users; listed here only so a cloud test
      # behaves like the local one.
      #
      # The login test code (TEST_OTP, default 123456) and ALLOW_DEV_OTP are
      # no longer in this file: the code now refuses the test code whenever
      # NODE_ENV=production, and owners can see number plates through the web
      # dashboard, so a guessable login is a data leak. For a closed cloud
      # test window ONLY, set ALLOW_TEST_OTP_IN_PRODUCTION=true in the Render
      # dashboard (never here) and remove it afterwards. Real sign-in needs a
      # real SMS provider (sms.provider / SMS_PROVIDER), see HANDOFF 4.2.
      #
      # BARRIER_DEMO_MODE skips the booking status, payment and time-window
      # checks and routes every space to one barrier, so any booking opens
      # it at any time. Still live for the cloud test; DELETE BOTH of these
      # before this URL goes in front of anybody who is not you.
      - key: BARRIER_DEMO_MODE
        value: "true"
      - key: BARRIER_DEMO_DEVICE_ID
        value: pb-001
