<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkFNB: label the lot</title>
<link rel="stylesheet" href="/static/css/parkfnb.css">
<style>
  body { margin: 0; background: var(--bg, #f4f7f5); color: var(--ink, #1f2a24); font: 14px/1.4 system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: auto; border-radius: 12px; background: #000; cursor: crosshair; display: block; }
  .panel { background: var(--card, #fff); border: 1px solid var(--line, #d7e0da); border-radius: 12px; padding: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line, #cbd6cf); background: var(--card, #fff); cursor: pointer; font: inherit; color: inherit; }
  .btn:hover { border-color: var(--brand, #1f6b4a); }
  .btn.on { background: var(--brand, #1f6b4a); color: #fff; border-color: transparent; }
  .bay { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .bay.sel { border-color: var(--brand, #1f6b4a); background: var(--green-soft, #e6f2eb); }
  .tagx { font-weight: 600; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--grey-soft, #edf1ee); }
  .muted { color: var(--muted, #5b6b62); }
  kbd { background: var(--grey-soft, #edf1ee); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <canvas id="cv" width="1280" height="720"></canvas>
    <div class="row"><span id="where" class="muted"></span></div>
  </div>
  <div class="panel">
    <h1>Label what you SEE</h1>
    <p class="muted" style="margin:0 0 8px">Look at the picture, not at what the system said. The system's answer is hidden on purpose, so it cannot sway you (press <kbd>s</kbd> to peek afterwards).</p>
    <div class="row">
      <select id="day" class="fld"></select>
      <button class="btn" id="prev">&larr; Prev</button>
      <button class="btn" id="next">Next &rarr;</button>
      <button class="btn" id="nextUn" title="Next picture with a bay not labelled yet">Next unlabelled <kbd>j</kbd></button>
    </div>
    <div id="bays"></div>
    <div class="row" id="choices"></div>
    <div class="row" id="sides" hidden>
      <span class="muted">Over which line?</span>
      <button class="btn" data-side="left">Left</button><button class="btn" data-side="right">Right</button>
      <button class="btn" data-side="near">Front (road)</button><button class="btn" data-side="far">Back</button>
    </div>
    <div class="row muted" id="progress"></div>
    <div class="row">
      <a class="btn" id="dlTruth" href="#">Download truth.csv</a>
      <a class="btn" id="dlRun" href="#">Download the system's log</a>
    </div>
    <p class="muted" style="margin:6px 0 0">Score it: <code>python tools/eval_pilot.py --truth truth.csv --log run.jsonl</code></p>
  </div>
</div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search), CAM = params.get("camera_id") || params.get("camera") || "phone-1";
  var $ = function (id) { return document.getElementById(id); };
  var cv = $("cv"), ctx = cv.getContext("2d");
  var frames = [], labels = {}, idx = 0, sel = null, day = "", peek = false, img = new Image(), pendingVerdict = null;

  var CHOICES = [
    ["e", "Empty", { state: "VACANT" }],
    ["c", "Car, inside its lines", { state: "OCCUPIED", verdict: "correct" }],
    ["t", "Car, close to a line", { state: "OCCUPIED", verdict: "close_to_line" }],
    ["o", "Car, OVER a line", { state: "OCCUPIED", verdict: "over_line", needSide: true }],
    ["n", "Car (cannot judge the line)", { state: "OCCUPIED" }],
    ["x", "Cannot tell", { state: "SKIP" }]
  ];
  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {})).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || ("Server said " + r.status)); return d; });
    });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function frame() { return frames[idx]; }
  function bayIds() { return frame() ? Object.keys(frame().polygons || {}).sort() : []; }
  function labelOf(file, bay) { return (labels[file] || {})[bay]; }

  function load(d) {
    day = d;
    return api("/console/api/record/frames?camera_id=" + encodeURIComponent(CAM) + "&day=" + encodeURIComponent(d)).then(function (r) {
      frames = r.frames; labels = r.labels || {}; idx = 0; sel = null; show();
    });
  }
  function show() {
    var f = frame();
    if (!f) { $("where").textContent = "No recorded pictures for this day."; ctx.clearRect(0, 0, cv.width, cv.height); paintPanel(); return; }
    if (!sel || !(sel in f.polygons)) sel = firstUnlabelled(f) || bayIds()[0];
    img = new Image();
    img.onload = draw;
    img.src = "/console/api/record/frame/" + day + "/" + f.file + "?camera_id=" + encodeURIComponent(CAM);
    var t = new Date(f.t * 1000);
    $("where").textContent = "Picture " + (idx + 1) + " of " + frames.length + " · " + t.toLocaleString() + (f.light === "low" ? " · night" : "");
    paintPanel();
  }
  function firstUnlabelled(f) { return Object.keys(f.polygons).sort().filter(function (b) { return !labelOf(f.file, b); })[0]; }
  function colourOf(l) {
    if (!l) return "rgba(255,255,255,.85)";
    return l.state === "VACANT" ? "#22c55e" : l.state === "SKIP" ? "#9ca3af" : l.verdict === "over_line" ? "#ef4444" : l.verdict === "close_to_line" ? "#f59e0b" : "#3b82f6";
  }
  function draw() {
    var f = frame(); if (!f) return;
    cv.width = img.naturalWidth || f.size[0]; cv.height = img.naturalHeight || f.size[1];
    var k = cv.width / f.size[0];
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    Object.keys(f.polygons).sort().forEach(function (b) {
      var p = f.polygons[b], l = labelOf(f.file, b);
      ctx.beginPath();
      p.forEach(function (pt, i) { i ? ctx.lineTo(pt[0] * k, pt[1] * k) : ctx.moveTo(pt[0] * k, pt[1] * k); });
      ctx.closePath();
      ctx.lineWidth = b === sel ? 5 : 2.5; ctx.strokeStyle = colourOf(l); ctx.stroke();
      if (b === sel) { ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill(); }
      var cx = p.reduce(function (a, q) { return a + q[0]; }, 0) / p.length * k, cy = p.reduce(function (a, q) { return a + q[1]; }, 0) / p.length * k;
      ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
      ctx.strokeText(b.replace("Bay-", ""), cx - 8, cy); ctx.fillText(b.replace("Bay-", ""), cx - 8, cy);
    });
  }
  function inside(p, x, y) {
    var c = false;
    for (var i = 0, j = p.length - 1; i < p.length; j = i++)
      if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) c = !c;
    return c;
  }
  cv.addEventListener("click", function (e) {
    var f = frame(); if (!f) return;
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * f.size[0], y = (e.clientY - r.top) / r.height * f.size[1];
    var hit = Object.keys(f.polygons).filter(function (b) { return inside(f.polygons[b], x, y); })[0];
    if (hit) { sel = hit; pendingVerdict = null; draw(); paintPanel(); }
  });

  function paintPanel() {
    var f = frame(), box = $("bays"), ch = $("choices");
    box.textContent = ""; ch.textContent = ""; $("sides").hidden = true;
    if (!f) return;
    bayIds().forEach(function (b) {
      var row = el("div", "bay" + (b === sel ? " sel" : "")), l = labelOf(f.file, b);
      row.appendChild(el("span", "", b));
      var right = el("span");
      if (peek) { var sysv = (f.bays || {})[b] || {}; right.appendChild(el("span", "tagx", "system: " + (sysv.status || "–") + (sysv.verdict ? " / " + sysv.verdict : ""))); right.appendChild(document.createTextNode(" ")); }
      right.appendChild(el("span", "tagx", l ? (l.state === "VACANT" ? "empty" : l.state === "SKIP" ? "cannot tell" : (l.verdict || "car")) : "not labelled"));
      row.appendChild(right);
      row.onclick = function () { sel = b; pendingVerdict = null; draw(); paintPanel(); };
      box.appendChild(row);
    });
    CHOICES.forEach(function (c) {
      var b = el("button", "btn", c[1] + "  "); b.appendChild(el("kbd", "", c[0]));
      b.onclick = function () { choose(c); };
      ch.appendChild(b);
    });
    var n = frames.filter(function (x) { return Object.keys(x.polygons || {}).every(function (b) { return (labels[x.file] || {})[b]; }); }).length;
    $("progress").textContent = n + " of " + frames.length + " pictures fully labelled";
    $("dlTruth").href = "/console/api/record/truth.csv?camera_id=" + encodeURIComponent(CAM);
    $("dlRun").href = "/console/api/record/run.jsonl?camera_id=" + encodeURIComponent(CAM) + "&day=" + encodeURIComponent(day);
  }

  function choose(c) {
    var f = frame(); if (!f || !sel) return;
    if (c[2].needSide) {                                  // which line: one more click, or Enter for "not sure which"
      pendingVerdict = c; $("sides").hidden = false; return;
    }
    send(c[2], null);
  }
  $("sides").addEventListener("click", function (e) {
    var s = e.target.getAttribute && e.target.getAttribute("data-side");
    if (s && pendingVerdict) send(pendingVerdict[2], s);
  });
  function send(a, side) {
    var f = frame(), bay = sel;
    api("/console/api/record/label?camera_id=" + encodeURIComponent(CAM), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ day: day, file: f.file, bay: bay, state: a.state, verdict: a.verdict || null, side: side }) })
      .then(function (r) {
        (labels[f.file] = labels[f.file] || {})[bay] = { state: r.label.state, verdict: r.label.verdict, side: r.label.side };
        pendingVerdict = null;
        var nxt = firstUnlabelled(f);
        if (nxt) sel = nxt; else if (idx < frames.length - 1) { idx += 1; sel = null; show(); return; }
        draw(); paintPanel();
      })
      .catch(function (e) { $("progress").textContent = "Could not save: " + e.message; });
  }
  function go(d) { var n = idx + d; if (n >= 0 && n < frames.length) { idx = n; sel = null; pendingVerdict = null; show(); } }
  function nextUnlabelled() {
    for (var i = idx + 1; i < frames.length; i++) if (firstUnlabelled(frames[i])) { idx = i; sel = null; show(); return; }
    $("progress").textContent = "Every later picture is labelled.";
  }
  $("prev").onclick = function () { go(-1); }; $("next").onclick = function () { go(1); }; $("nextUn").onclick = nextUnlabelled;
  $("day").onchange = function () { load($("day").value); };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey) return;
    var k = e.key.toLowerCase();
    if (k === "arrowleft") go(-1); else if (k === "arrowright") go(1); else if (k === "j") nextUnlabelled();
    else if (k === "s") { peek = !peek; paintPanel(); }
    else if (/^[1-9]$/.test(k)) { var ids = bayIds(); if (ids[+k - 1]) { sel = ids[+k - 1]; pendingVerdict = null; draw(); paintPanel(); } }
    else if (pendingVerdict && "lrfb".indexOf(k) >= 0) send(pendingVerdict[2], { l: "left", r: "right", f: "near", b: "far" }[k]);
    else CHOICES.forEach(function (c) { if (c[0] === k) choose(c); });
  });

  api("/console/api/record/status?camera_id=" + encodeURIComponent(CAM)).then(function (s) {
    var sel0 = $("day");
    if (!s.days.length) { $("where").textContent = s.on ? "Nothing recorded yet." : "Recording is off. " + s.how; return; }
    s.days.forEach(function (d) { var o = el("option", "", d.day + " (" + d.frames + " pictures, " + d.labelled_frames + " labelled)"); o.value = d.day; sel0.appendChild(o); });
    load(s.days[0].day);
  }).catch(function (e) { $("where").textContent = "Could not load: " + e.message + ". Sign in as an operator first."; });
})();
</script>
</body>
</html>
