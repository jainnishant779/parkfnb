<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkFNB Activity Log</title>
<meta name="theme-color" content="#F3F3F3">
<script src="/static/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&display=swap">
<style>
  /* The ParkFNB look (static/css/parkfnb.css, the same values): Urbanist, a grey canvas, white 24 px cards without borders,
     grey-filled inputs, pill buttons, black ("ink") for what is primary.  Light by default; dark only when data-theme="dark". */
  :root {
    --bg: #F3F3F3; --surface: #FFFFFF; --fill: #EFEFEF; --fill-2: #E6E6E6; --line: #E9E9E9; --line-2: #F1F1F1;
    --text: #161616; --text-2: #555555; --muted: #8A8A8A;
    --ink: #141414; --on-ink: #FFFFFF; --brand-2: #000000; --mark: #141414;
    --peach: #F6CB91; --peach-deep: #E9A55A;
    --green: #2FA66A; --amber: #B57610; --red: #E0413A; --blue: #2F5BB8; --grey: #8A8A8A;
    --glass: rgba(255, 255, 255, .72); --glass-edge: rgba(255, 255, 255, .7);
    --r-sm: 12px; --r-lg: 24px; --pill: 999px; --gap: 16px;
    --font: "Urbanist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0F0F0F; --surface: #1A1A1A; --fill: #262626; --fill-2: #303030; --line: #2C2C2C; --line-2: #232323;
    --text: #F2F2F2; --text-2: #BDBDBD; --muted: #8F8F8F;
    --ink: #F3F3F3; --on-ink: #141414; --brand-2: #FFFFFF; --mark: #2E2E2E;
    --green: #4CC38A; --amber: #F0B13A; --red: #FF6B60; --blue: #8FB0F2; --grey: #8F8F8F;
    --glass: rgba(26, 26, 26, .78); --glass-edge: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px/1.5 var(--font);
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .app { max-width: 1104px; margin: 0 auto; padding: 16px; }

  /* ---- header: a glass pill, as on the website and /live */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
         min-height: 64px; padding: 8px;
         background: var(--card, var(--surface));
         border-radius: 32px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
          background: var(--mark); color: var(--peach); }
  .logo svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
  .brand b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; }
  .brand b i { font-style: normal; color: var(--peach-deep); }
  .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .top a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: var(--pill);
           color: var(--text-2); font-size: 14px; font-weight: 600; text-decoration: none; }
  .top a:hover { background: var(--fill); color: var(--text); }
  .top .pf-theme { background: var(--surface); }

  /* ---- the card: filters on top, then the table; first and last cells 24 px from the card's edge */
  .card { background: var(--surface); border-radius: var(--r-lg); margin-top: var(--gap); overflow: hidden; }
  .bar { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 24px 24px 16px; }
  .bar label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .bar label .eg { color: var(--muted); font-weight: 500; }
  select, input { min-height: 44px; min-width: 0; padding: 0 16px; border: 1.5px solid transparent;
                  border-radius: var(--r-sm); background: var(--fill); color: var(--text); font-size: 15px;
                  font-weight: 500; transition: border-color .15s, background-color .15s; }
  select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer;
           background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                             linear-gradient(135deg, var(--muted) 50%, transparent 50%);
           background-position: calc(100% - 22px) 50%, calc(100% - 17px) 50%;
           background-size: 5px 5px; background-repeat: no-repeat; }
  input::placeholder { color: var(--muted); }
  select:focus, input:focus { outline: none; border-color: var(--ink); background-color: var(--surface); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
         padding: 0 20px; border: 0; border-radius: var(--pill); background: var(--fill); color: var(--text);
         font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
         transition: background-color .15s; }
  .btn:hover { background: var(--fill-2); }
  .btn.primary { background: var(--ink); color: var(--on-ink); }
  .btn.primary:hover { background: var(--brand-2); }
  .grow { flex: 1; min-width: 176px; }
  .grow input { width: 100%; }
  .count { color: var(--muted); font-size: 13px; padding: 0 24px 8px; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 16px; vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
       white-space: nowrap; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line-2); }
  tr:last-child td { border-bottom: 0; }
  th:first-child, td:first-child { padding-left: 24px; }
  th:last-child, td:last-child { padding-right: 24px; }
  td.t { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.d { color: var(--text-2); word-break: break-word; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
         vertical-align: 1px; background: var(--grey); }
  .msg { padding: 32px 24px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--red); }
  .more { padding: 8px 24px 24px; text-align: center; }
  @media (max-width: 560px) {
    .app { padding: 8px; } .top { top: 8px; border-radius: 28px; } .brand small { display: none; }
    .top a { padding: 0 8px; } .top-right { gap: 0; } .brand { gap: 8px; }
    .bar { padding: 16px 16px 12px; gap: 12px; } .bar label, .bar .btn { flex: 1 1 100%; min-width: 0; }
    .bar select { width: 100%; }
    .count { padding: 0 16px 8px; } th, td { padding: 12px 8px; }
    th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
    .hide-s { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
        <circle cx="12" cy="10" r="3"/></svg></div>
      <div><b>parkfnb<i>.</i></b><small>Activity log</small></div>
    </div>
    <nav class="top-right">
      <a href="/">&larr; Console</a>
      <a id="back" href="/live">Live view</a>
      <button data-theme-toggle></button>
    </nav>
  </header>

  <section class="card">
    <div class="bar">
      <label>Period
        <select id="days">
          <option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option><option value="0">Everything</option>
        </select>
      </label>
      <label>Show
        <select id="kind">
          <option value="in,out,bay_occupied,bay_freed,bay_initial,feed_offline,feed_online,low_light,light_ok,camera_moved,camera_ok,operator,parking_over_line,parking_ok" selected>All events</option>
          <option value="">Everything, with the minute-by-minute samples</option>
          <option value="bay_occupied,bay_freed,bay_initial">Bays turning occupied / free</option>
          <option value="in,out">Cars at the gate</option>
          <option value="feed_offline,feed_online,low_light,light_ok,camera_moved,camera_ok">Camera and light problems</option>
          <option value="operator">Operator answers</option>
          <option value="sample">Minute-by-minute occupancy</option>
        </select>
      </label>
      <label class="grow"><span>Bay <span class="eg" id="bayEg">(as in the Bay column)</span></span>
        <input id="bay" type="text" placeholder="All bays" maxlength="32" autocomplete="off">
      </label>
      <a class="btn primary" id="csv" href="#" download>Download CSV</a>
    </div>
    <div class="count" id="count" role="status"></div>
    <div class="wrap">
      <table>
        <thead><tr><th>Time</th><th>Event</th><th>Bay</th><th class="hide-s">Detail</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="more" id="more" hidden><button class="btn" id="moreBtn" type="button">Show more</button></div>
  </section>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var cam = (params.get("camera_id") || "phone-1");
  var camQ = encodeURIComponent(cam);
  var $ = function (id) { return document.getElementById(id); };
  var PAGE = 300, shown = 0, total = 0, rowsAll = [];
  // the theme's meaning colours (CSS variables, so they follow light / dark)
  var R = "var(--red)", G = "var(--green)", A = "var(--amber)", B = "var(--blue)", N = "var(--grey)";
  var COLOUR = { bay_occupied: R, bay_freed: G, bay_initial: N, in: G, out: A,
                 feed_offline: R, feed_online: G, low_light: A, light_ok: G,
                 camera_moved: A, camera_ok: G, operator: B, sample: N,
                 parking_over_line: R, parking_ok: G };
  $("back").href = "/live?camera_id=" + camQ;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function query() { return "camera_id=" + camQ + "&days=" + encodeURIComponent($("days").value) + "&kind=" + encodeURIComponent($("kind").value); }
  function setCsv() { $("csv").href = "/live/log.csv?" + query(); }
  function say(text, err) { var m = $("msg"); m.hidden = !text; m.textContent = text || ""; m.className = "msg" + (err ? " err" : ""); }

  // the hint next to "Bay" names a real bay from this log (ids are "Bay-03" on most sites, "P3" where they are plain numbers)
  function bayExample() {
    for (var i = 0; i < rowsAll.length; i++) if (rowsAll[i].bay) { $("bayEg").textContent = "(like " + rowsAll[i].bay + ")"; return; }
  }

  function stamp(epoch) {                                   // in the browser's own timezone
    var d = new Date(epoch * 1000);
    return d.toLocaleDateString([], { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function draw() {
    var want = $("bay").value.trim().toLowerCase(), tb = $("rows");
    while (tb.firstChild) tb.removeChild(tb.firstChild);
    var list = rowsAll.filter(function (r) { return !want || (r.bay || "").toLowerCase() === want || (r.bay || "").toLowerCase() === "p" + want; });
    var upto = Math.min(list.length, shown || PAGE);
    list.slice(0, upto).forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "t", stamp(r.epoch)));
      var ev = el("td"); var dot = el("i", "dot"); dot.style.background = COLOUR[r.type] || "var(--grey)";
      ev.appendChild(dot); ev.appendChild(document.createTextNode(r.event)); tr.appendChild(ev);
      tr.appendChild(el("td", "", r.bay || ""));
      tr.appendChild(el("td", "d hide-s", r.detail || ""));
      tb.appendChild(tr);
    });
    $("more").hidden = upto >= list.length;
    $("count").textContent = list.length + " event" + (list.length === 1 ? "" : "s") + (want ? " for " + $("bay").value.trim() : "") +
                             (total > rowsAll.length ? " (showing the newest " + rowsAll.length + " of " + total + "; download the CSV for all)" : "");
    say(list.length ? "" : (total ? "Nothing for that bay." : "Nothing has been logged for this period yet."), false);
  }

  function load() {
    setCsv(); say("Loading…", false);
    fetch("/live/log.json?" + query() + "&limit=5000", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) {
        if (r.status === 403) throw new Error("This page is for the operator. Sign in with the admin link first.");
        if (!r.ok) throw new Error("The server answered " + r.status + ".");
        return r.json();
      })
      .then(function (j) { rowsAll = j.rows; total = j.total; shown = PAGE; bayExample(); draw(); })
      .catch(function (e) { rowsAll = []; total = 0; draw(); $("count").textContent = ""; say(e.message, true); });
  }

  $("days").onchange = load; $("kind").onchange = load;
  $("bay").oninput = function () { shown = PAGE; draw(); };
  $("moreBtn").onclick = function () { shown += PAGE; draw(); };
  load();
})();
</script>
</body>
</html>
