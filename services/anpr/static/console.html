<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkFNB Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/css/parkfnb.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">P</div>
      <div class="lbl"><b>ParkFNB</b><small>Parking Management</small></div>
      <button class="collapse" id="collapse" type="button" title="Collapse the menu" aria-label="Collapse the menu">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <div class="grp">Operations</div>
      <a href="#/dashboard" data-r="dashboard" title="Dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Dashboard</span></a>
      <a href="#/live" data-r="live" title="Live Operations"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg><span class="lbl">Live Operations</span></a>
      <a href="#/lots" data-r="lots" title="Parking Lots"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16M9 21v-5h6v5M8 9h2M14 9h2M8 13h2M14 13h2"/></svg><span class="lbl">Parking Lots</span></a>
      <a href="#/vehicles" data-r="vehicles" title="Vehicles / ANPR"><svg viewBox="0 0 24 24"><path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16M4 16h16v3h-2.5v-1.5h-11V19H4zM7.5 13h.01M16.5 13h.01"/></svg><span class="lbl">Vehicles / ANPR</span></a>
      <a href="#/violations" data-r="violations" title="Violations"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v4M12 17.5h.01"/></svg><span class="lbl">Violations</span><span class="badge" id="vbadge" hidden>0</span></a>
      <div class="grp">Analytics</div>
      <a href="#/sessions" data-r="sessions" title="Sessions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl">Sessions</span></a>
      <a href="#/reports" data-r="reports" title="Reports"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg><span class="lbl">Reports</span></a>
      <div class="grp">Setup</div>
      <a href="#/devices" data-r="devices" title="Devices"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="lbl">Devices &amp; bay health</span></a>
      <a href="#/layout" data-r="layout" title="Bay layout (opens the editor)"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg><span class="lbl">Bay layout</span><span class="ext" aria-hidden="true">↗</span></a>
      <a href="#/log" data-r="log" title="Activity log (opens the log page)"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="lbl">Activity log</span><span class="ext" aria-hidden="true">↗</span></a>
      <a href="#/settings" data-r="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span class="lbl">Settings</span></a>
      <div class="soon lbl" title="These need the payment and booking backend and staff accounts, which come with the apps">Coming later: Transactions · Users &amp; Roles</div>
    </nav>
    <div class="site-chip">
      <div class="ico" id="siteIco">P</div>
      <div><b id="siteName">ParkFNB</b><small id="siteSub">–</small></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="title">Dashboard</h1>
      <label class="pick" title="Camera"><span aria-hidden="true">📍</span><select id="camPick" aria-label="Camera"></select></label>
      <span class="pill" id="statePill">–</span>
      <div class="who">
        <span class="muted" id="clock"></span>
        <div class="avatar" id="avatar" title="Signed in">A</div>
        <a class="linkish" href="/admin/logout?next=/live">Sign out</a>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<script src="/static/js/console.js"></script>
<script src="/static/js/console-reports.js"></script>
</body>
</html>
