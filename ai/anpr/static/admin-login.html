<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ParkFNB Operator Sign In</title>
<meta name="theme-color" content="#F3F3F3">
<script src="/static/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&display=swap">
<style>
  /* the look of the ParkFNB website and apps (see static/css/parkfnb.css) */
  :root {
    --bg: #F3F3F3; --surface: #FFFFFF; --fill: #EFEFEF; --text: #161616; --text-2: #555555; --muted: #8A8A8A;
    --ink: #141414; --on-ink: #FFFFFF; --peach: #F6CB91; --peach-deep: #E9A55A; --mark: #141414;
    --red: #E0413A; --red-soft: #FDE6E4; --amber: #B57610; --amber-soft: #FCF0DA;
  }
  :root[data-theme="dark"] { --bg: #0F0F0F; --surface: #1A1A1A; --fill: #262626; --text: #F2F2F2; --text-2: #BDBDBD; --muted: #8F8F8F;
    --ink: #F3F3F3; --on-ink: #141414; --mark: #2E2E2E; --red: #FF6B60; --red-soft: #3B1C1A; --amber: #F0B13A; --amber-soft: #3A2C10; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font: 500 15px/1.5 "Urbanist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { width: 100%; max-width: 400px; background: var(--surface); border-radius: 28px; padding: 32px 24px 24px; }
  .top { display: flex; gap: 12px; align-items: center; margin-bottom: 32px; } .top > div:nth-child(2) { flex: 1; }
  .logo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--mark); color: var(--peach); flex: none; }
  .logo svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .top b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; } .top b i { font-style: normal; color: var(--peach-deep); }
  .top small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
  form { display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
  label { display: grid; gap: 8px; font-size: 13px; color: var(--text-2); font-weight: 600; }
  input { font: inherit; font-size: 16px; height: 54px; padding: 0 18px; border-radius: 16px; border: 1.5px solid transparent; background: var(--fill); color: var(--text); }
  input:focus { outline: none; border-color: var(--ink); background: var(--surface); }
  button:not(.pf-theme):not([data-theme-toggle]) { font: inherit; font-weight: 600; font-size: 16px; height: 56px; border: 0; border-radius: 999px; background: var(--ink); color: var(--on-ink); cursor: pointer; margin-top: 8px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { padding: 12px 16px; border-radius: 16px; font-size: 14px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .msg.lock { background: var(--amber-soft); color: var(--amber); }
  .back { text-align: center; font-size: 14px; padding-top: 24px; } .back a { color: var(--text-2); font-weight: 600; text-decoration: none; }
  .back a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<main class="box">
  <div class="top"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div><b>parkfnb<i>.</i></b><small>Operator console</small></div><button data-theme-toggle></button></div>
  <form method="post" action="/admin" id="f" autocomplete="on">
    <h1>Sign in</h1>
    <div class="msg" id="msg" role="alert" hidden></div>
    <label>ID <input name="user" id="user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus></label>
    <label>Password <input name="password" id="pw" type="password" autocomplete="current-password" maxlength="256" required></label>
    <input type="hidden" name="next" id="next" value="">
    <button type="submit" id="go">Sign in</button>
  </form>
  <div class="back"><a href="/live">&larr; Back to the live view</a></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), msg = document.getElementById("msg");
  document.getElementById("next").value = q.get("next") || "";
  var err = q.get("error");
  if (err === "wrong") { msg.textContent = "Wrong ID or password."; msg.hidden = false; }
  else if (err === "locked") {
    var w = parseInt(q.get("wait"), 10) || 15;
    msg.textContent = "Too many wrong tries. Please wait about " + w + " minute" + (w === 1 ? "" : "s") + " and try again.";
    msg.className = "msg lock"; msg.hidden = false;
  }
  document.getElementById("f").addEventListener("submit", function () { document.getElementById("go").disabled = true; });
})();
</script>
</body>
</html>
